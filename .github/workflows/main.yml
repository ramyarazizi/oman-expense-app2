name: Build Oman App (Android APK + Windows EXE)

on:
  push:
  workflow_dispatch:

jobs:
  build-android-apk:
    name: 1. Build Android (.apk)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Create Flutter Project and Build Release APK
        run: |
          flutter create --platforms=android --project-name oman_expense_app --org om.ramyar.expenses app_project
          DART_FILE=$(ls -t *.dart 2>/dev/null | head -n 1)
          if [ -n "$DART_FILE" ]; then
            cp "$DART_FILE" app_project/lib/main.dart
          fi
          python3 -c 'p="app_project/android/app/src/main/AndroidManifest.xml"; s=open(p).read(); open(p,"w").write(s.replace("<application", "<uses-permission android:name=\"android.permission.INTERNET\"/>\n    <application", 1)) if "android.permission.INTERNET" not in s else None'
          cd app_project
          flutter build apk --release

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: 1-Oman-Expense-Android-APK
          path: app_project/build/app/outputs/flutter-apk/app-release.apk

  build-windows-exe:
    name: 2. Build Windows Desktop (.exe)
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Flutter SDK on Windows
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Build Windows Release EXE
        shell: bash
        run: |
          flutter config --enable-windows-desktop
          flutter create --platforms=windows --project-name oman_expense_app app_project
          DART_FILE=$(ls -t *.dart 2>/dev/null | head -n 1)
          if [ -n "$DART_FILE" ]; then
            cp "$DART_FILE" app_project/lib/main.dart
          fi
          cd app_project
          flutter build windows --release

      - name: Upload Windows EXE Package
        uses: actions/upload-artifact@v4
        with:
          name: 2-Oman-Expense-Windows-EXE
          path: app_project/build/windows/x64/runner/Release/
